handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler
# Niveau des logs de l'application : passer à FINE pour suivre chaque modification du modèle
com.musigma.level=INFO
java.util.logging.ConsoleHandler.level=SEVERE
java.util.logging.FileHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.pattern=%t/musigma-%u-%g.log
# %6$s ajoute la trace de l'exception éventuelle
java.util.logging.SimpleFormatter.format=[%1$s] %4$-10s | (%3$s) %2$-15s | %5$s%6$s%n
