# Intégration continue : tests et javadoc à chaque push.
# Les tests de l'interface JavaFX sont ignorés faute d'affichage sur le runner.
image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven
  paths:
    - .m2/repository

stages:
  - test
  - doc

test:
  stage: test
  script:
    - mvn -B test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml

javadoc:
  stage: doc
  script:
    - mvn -B javadoc:javadoc
  artifacts:
    paths:
      - target/reports/apidocs
    expire_in: 30 days
